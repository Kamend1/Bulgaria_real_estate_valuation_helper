services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appraiser
      POSTGRES_PASSWORD: appraiser
      POSTGRES_DB: appraisal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appraiser"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env (that one points at
      # localhost:54891 for native/Windows-service Postgres) so the
      # container talks to the compose-internal `db` service instead.
      - DATABASE_URL=postgresql+psycopg2://appraiser:appraiser@db:5432/appraisal
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
