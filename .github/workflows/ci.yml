name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg16 is postgres:16's own Debian base with the
        # `vector` extension pre-built in -- migration 0019 (Phase 7) runs
        # CREATE EXTENSION IF NOT EXISTS vector, which fails on plain
        # postgres:16 (no extension control file). Same image swap already
        # done for local dev (see plan doc's Phase 7 "pgvector target"
        # note) -- CI's service container needed the same fix.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: appraiser
          POSTGRES_PASSWORD: appraiser
          POSTGRES_DB: appraisal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://appraiser:appraiser@localhost:5432/appraisal
      # CI-only value, never used outside this ephemeral run -- app/config.py
      # requires a real (non-placeholder, >=32 char) SECRET_KEY to even import.
      SECRET_KEY: ci-only-secret-key-1234567890-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov=utils --cov-report=term-missing
