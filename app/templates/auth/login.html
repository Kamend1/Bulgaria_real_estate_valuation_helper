{% extends "base.html" %}
{% block title %}Вход — Дигитален асистент на имотния оценител{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card card">
    <h1 class="auth-title">Вход в системата</h1>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/auth/login">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group">
        <label for="login">Имейл или потребителско ime</label>
        <input type="text" id="login" name="login" class="form-control" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Парола</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-full">Влез</button>
    </form>

    <div class="auth-links">
      <span>Нямате акаунт?</span>
      <a href="/auth/register">Регистрирайте се</a>
    </div>
  </div>
</div>
{% endblock %}
